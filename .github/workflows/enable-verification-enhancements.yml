name: Enable Duplicate-Safe Verification UI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/enable-verification-enhancements.yml'
      - 'verification-enhancements.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load verification enhancements after the main application
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '  <script src="./verification-enhancements.js"></script>\n'
          if tag not in text:
              if '</body>' not in text:
                  raise SystemExit('Could not find </body> in index.html')
              text = text.replace('</body>', tag + '</body>', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check verification-enhancements.js
          grep -q 'verification-enhancements.js' index.html

      - name: Commit UI enablement
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Duplicate-safe verification UI is already enabled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable duplicate-safe verification workflow"
          git push
