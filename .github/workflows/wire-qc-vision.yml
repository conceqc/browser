name: Wire QC Vision Into Browser

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wire-qc-vision.yml'
      - 'scripts/wire_qc_vision.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Connect product photos to the QC vision function
        run: python scripts/wire_qc_vision.py

      - name: Validate browser integration
        shell: bash
        run: |
          grep -q 'functions/v1/qc-vision' index.html
          grep -q 'async function readComponentPhoto' index.html
          grep -q 'document.getElementById("readPhoto")?.addEventListener("click",readComponentPhoto)' index.html
          ! grep -q 'Photo OCR and AI identification will activate' index.html

          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/qc-browser-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/qc-browser-inline.js

      - name: Commit browser integration
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "QC vision is already connected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect product photos to AI identification"
          git push
