name: Wire QC Vision Into Browser

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wire-qc-vision.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Connect product photos to the QC vision function
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Could not find expected {label} block")
              text = text.replace(old, new, 1)

          replace_once(
              'verificationEndpoint: ""',
              'verificationEndpoint: "https://kwahzlezpitvurnjljew.supabase.co/functions/v1/qc-vision"',
              "verification endpoint"
          )

          replace_once(
              '      componentPhoto: null,\n      equipmentPhoto: null,\n      result: null,',
              '      componentPhoto: null,\n      equipmentPhoto: null,\n      readingPhoto: false,\n      aiExtraction: null,\n      result: null,',
              "photo state"
          )

          replace_once(
              '<button id="readPhoto" class="button button-secondary" type="button" ${state.componentPhoto?"":"disabled"}>${icon.camera} Read photo</button>',
              '<button id="readPhoto" class="button button-secondary" type="button" ${state.componentPhoto && !state.readingPhoto?"":"disabled"}>${icon.camera} ${state.readingPhoto?"Reading photo…":"Read photo"}</button>',
              "read photo button"
          )

          helper_marker = '    function matchProduct() {'
          helper_code = r'''    async function preparePhotoForAi(file) {
      const supported = ["image/jpeg","image/jpg","image/png","image/webp","image/gif"].includes(String(file.type||"").toLowerCase());
      if (supported && file.size <= 6 * 1024 * 1024) return file;
      if (!("createImageBitmap" in window)) {
        if (supported && file.size <= 8 * 1024 * 1024) return file;
        throw new Error("This photo format could not be prepared. Try a JPG/PNG image, a screenshot, or take a new photo.");
      }

      let bitmap;
      try {
        bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
      } catch {
        try {
          bitmap = await createImageBitmap(file);
        } catch {
          throw new Error("This photo format could not be opened. Try a JPG/PNG image, a screenshot, or take a new photo.");
        }
      }

      const maxDimension = 2200;
      const scale = Math.min(1, maxDimension / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(bitmap.width * scale));
      canvas.height = Math.max(1, Math.round(bitmap.height * scale));
      const context = canvas.getContext("2d", { alpha: false });
      if (!context) {
        bitmap.close?.();
        throw new Error("The browser could not prepare this photo.");
      }
      context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      bitmap.close?.();

      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.9));
      if (!blob) throw new Error("The browser could not compress this photo.");
      const baseName = String(file.name || "qc-photo").replace(/\.[^.]+$/, "") || "qc-photo";
      return new File([blob], `${baseName}.jpg`, { type: "image/jpeg", lastModified: Date.now() });
    }

    async function readComponentPhoto() {
      if (!state.componentPhoto?.file || state.readingPhoto) return;
      if (!CONFIG.verificationEndpoint) {
        toast("The AI photo-reading service has not been connected.");
        return;
      }
      if (!state.inspector || state.inspector.trim().length < 2) {
        toast("Enter the inspector name before reading a photo.");
        inspectorButton.click();
        return;
      }

      const sourceFile = state.componentPhoto.file;
      state.readingPhoto = true;
      state.result = null;
      render();
      let showResult = false;

      try {
        const uploadFile = await preparePhotoForAi(sourceFile);
        const form = new FormData();
        form.append("component_photo", uploadFile, uploadFile.name);
        form.append("inspector_name", state.inspector);
        form.append("project_code", CONFIG.projectCode);
        form.append("purpose", "PRODUCT_PHOTO");
        if (state.selectedEquipmentId) form.append("equipment_id", state.selectedEquipmentId);
        if (state.selectedRequirementId) form.append("equipment_requirement_id", state.selectedRequirementId);

        const response = await fetch(CONFIG.verificationEndpoint, {
          method: "POST",
          headers: {
            apikey: CONFIG.publishableKey,
            Authorization: `Bearer ${CONFIG.publishableKey}`
          },
          body: form
        });
        const body = await response.json().catch(() => null);
        if (!response.ok) {
          throw new Error(body?.message || `Photo reading failed (${response.status}).`);
        }

        state.manufacturer = String(body?.identified_manufacturer || "");
        state.model = String(body?.identified_model || "");
        state.aiExtraction = body?.ai_extraction || null;
        state.result = {
          status: body?.status || "CANNOT_IDENTIFY",
          matches: Array.isArray(body?.matches) ? body.matches : [],
          message: body?.message || "",
          ai_confidence: body?.ai_confidence,
          ai_extraction: body?.ai_extraction || null,
          request_id: body?.request_id || null
        };
        showResult = true;
      } catch (error) {
        toast(error?.message || "The photo could not be read.");
      } finally {
        state.readingPhoto = false;
        render();
        if (showResult) {
          setTimeout(() => document.querySelector(".verification-result")?.scrollIntoView({ behavior: "smooth", block: "center" }), 0);
        }
      }
    }

'''
          if helper_code not in text:
              if helper_marker not in text:
                  raise SystemExit("Could not find product matching insertion point")
              text = text.replace(helper_marker, helper_code + helper_marker, 1)

          replace_once(
              'document.getElementById("readPhoto")?.addEventListener("click",()=>toast("Photo OCR and AI identification will activate with the verification Edge Function. Manual lookup is live now."));',
              'document.getElementById("readPhoto")?.addEventListener("click",readComponentPhoto);',
              "read photo event"
          )

          replace_once(
              'Object.assign(state,{componentPhoto:null,equipmentPhoto:null,selectedEquipmentId:"",selectedRequirementId:"",checklist:[],manufacturer:"",model:"",result:null});',
              'Object.assign(state,{componentPhoto:null,equipmentPhoto:null,readingPhoto:false,aiExtraction:null,selectedEquipmentId:"",selectedRequirementId:"",checklist:[],manufacturer:"",model:"",result:null});',
              "verification reset"
          )

          replace_once(
              '      const p=result.matches?.[0];\n      return ',
              '      const p=result.matches?.[0];\n      const ai=result.ai_extraction;\n      const aiIdentity=[ai?.manufacturer,ai?.model||ai?.series,ai?.product_type].filter(Boolean).join(" · ");\n      const aiConfidence=Number(result.ai_confidence);\n      const aiNote=ai?`<p class="field-note"><strong>Photo read:</strong> ${esc(aiIdentity||"Identification uncertain")}${Number.isFinite(aiConfidence)?` · ${Math.round(aiConfidence*100)}% confidence`:""}${ai.notes?`<br>${esc(ai.notes)}`:""}</p>`:"";\n      return ',
              "AI result summary"
          )

          replace_once(
              '<p>${message}</p>${p?',
              '<p>${message}</p>${aiNote}${p?',
              "AI result placement"
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate browser integration
        shell: bash
        run: |
          grep -q 'functions/v1/qc-vision' index.html
          grep -q 'async function readComponentPhoto' index.html
          grep -q 'document.getElementById("readPhoto")?.addEventListener("click",readComponentPhoto)' index.html
          ! grep -q 'Photo OCR and AI identification will activate' index.html

          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/qc-browser-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/qc-browser-inline.js

      - name: Commit browser integration
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "QC vision is already connected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect product photos to AI identification"
          git push
